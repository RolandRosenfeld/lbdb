name: buildtest
on:
  push:
  pull_request:
jobs:
  buildandtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libauthen-sasl-perl \
            libnet-ldap-perl \
            libpalm-perl \
            abook \
            maildir-utils \
            notmuch-addrlookup \
            notmuch
      - name: Configure
        run: ./configure
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: Upload testsuite artifacts (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: testsuite
          path: |
            tests/testsuite.dir
            tests/testsuite.log
